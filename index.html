<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wonderland</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0c10;
      touch-action: none;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #1f1f38 0%, #0b0c10 100%);
    }

    /* Grid de fondo decorativo espacial */
    .bg-grid {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 35px 35px;
    }

    /* HUD Superior */
    .hud {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .badge {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 15px;
      color: #00f0ff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      letter-spacing: 0.5px;
    }

    .badge-target {
      color: #ff007f;
    }

    /* Componentes de la Viborita Neón */
    .snake-node {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .snake-head {
      width: 32px;
      height: 32px;
      background: #ffffff;
      box-shadow: 0 0 15px #00f0ff, 0 0 30px #00f0ff;
      z-index: 6;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 4px;
    }

    /* Ojitos de la víbora */
    .snake-head::before, .snake-head::after {
      content: '';
      width: 6px;
      height: 6px;
      background-color: #0b0c10;
      border-radius: 50%;
    }

    .snake-body {
      width: 26px;
      height: 26px;
      z-index: 5;
    }

    /* Coleccionables (Mundos) */
    .item {
      position: absolute;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      animation: float 2.5s infinite ease-in-out;
      filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.8));
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-8px) scale(1.1); }
    }

    /* Overlay / Menú */
    .overlay {
      display: flex;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(11, 12, 16, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 20;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }

    .overlay-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 35px 25px;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    .overlay h2 { 
      color: #00f0ff; 
      margin-bottom: 20px; 
      font-size: 26px;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    .btn-action {
      background: linear-gradient(45deg, #ff007f, #7928ca);
      border: none;
      padding: 14px 32px;
      border-radius: 50px;
      color: #ffffff;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 0, 127, 0.5);
      transition: all 0.2s ease;
    }

    .btn-action:active { 
      transform: scale(0.96);
      box-shadow: 0 2px 10px rgba(255, 0, 127, 0.5);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="bg-grid"></div>
    
    <div class="hud">
      <div class="badge">Nivel <span id="level-num">1</span>/20</div>
      <div class="badge badge-target">Mundos: <span id="collected">0</span>/<span id="target">5</span> 🪐</div>
    </div>

    <!-- Contenedor para la serpiente -->
    <div id="snake-container"></div>

    <!-- Mundos -->
    <div id="items-container"></div>

    <!-- Cartel inicial / nivel -->
    <div id="level-modal" class="overlay">
      <div class="overlay-card">
        <h2 id="modal-title">¡Bienvenido/a!</h2>
        <button class="btn-action" onclick="startLevel()">¡Empezar!</button>
      </div>
    </div>
  </div>

  <script>
    const container = document.getElementById('game-container');
    const snakeContainer = document.getElementById('snake-container');
    const itemsContainer = document.getElementById('items-container');
    const levelDisplay = document.getElementById('level-num');
    const collectedDisplay = document.getElementById('collected');
    const targetDisplay = document.getElementById('target');
    const levelModal = document.getElementById('level-modal');

    let currentLevel = 1;
    let targetItems = 5;
    let collectedItems = 0;
    let isPlaying = false;

    // Configuración de la serpiente
    const SEGMENT_DISTANCE = 14;
    let snakeBody = []; 
    let snakeElements = []; 
    let targetX = window.innerWidth / 2;
    let targetY = window.innerHeight / 2;
    let items = [];

    // Íconos de mundos
    const worldIcons = ['🪐', '🌍', '🌌', '🪐', '🌎'];

    // Paleta Neón Multicolor para el cuerpo de la serpiente
    const neonColors = [
      '#ff007f', '#00f0ff', '#7000ff', '#00ff66', 
      '#ffea00', '#ff0055', '#00e5ff', '#a800ff'
    ];

    function startLevel() {
      levelModal.style.display = 'none';
      targetItems = 3 + (currentLevel * 2);
      collectedItems = 0;
      
      levelDisplay.innerText = currentLevel;
      targetDisplay.innerText = targetItems;
      collectedDisplay.innerText = collectedItems;

      targetX = window.innerWidth / 2;
      targetY = window.innerHeight / 2;

      initSnake();
      spawnItems();
      isPlaying = true;
      requestAnimationFrame(gameLoop);
    }

    function initSnake() {
      snakeContainer.innerHTML = '';
      snakeBody = [];
      snakeElements = [];

      const initialLength = 4;
      for (let i = 0; i < initialLength; i++) {
        snakeBody.push({ x: targetX, y: targetY + (i * SEGMENT_DISTANCE) });
        
        const el = document.createElement('div');
        el.className = 'snake-node ' + (i === 0 ? 'snake-head' : 'snake-body');
        
        if (i > 0) {
          applyNeonStyle(el, i);
        }
        
        snakeContainer.appendChild(el);
        snakeElements.push(el);
      }
    }

    function applyNeonStyle(element, index) {
      const color = neonColors[index % neonColors.length];
      element.style.backgroundColor = color;
      element.style.boxShadow = `0 0 10px ${color}, 0 0 20px ${color}`;
    }

    function addSnakeSegment() {
      const lastSegment = snakeBody[snakeBody.length - 1];
      snakeBody.push({ x: lastSegment.x, y: lastSegment.y });

      const el = document.createElement('div');
      el.className = 'snake-node snake-body';
      applyNeonStyle(el, snakeElements.length);
      
      snakeContainer.appendChild(el);
      snakeElements.push(el);
    }

    function updateSnakePositions() {
      if (snakeBody.length === 0) return;

      // Movimiento de la cabeza
      snakeBody[0].x += (targetX - snakeBody[0].x) * 0.2;
      snakeBody[0].y += (targetY - snakeBody[0].y) * 0.2;

      // El cuerpo sigue a la cabeza
      for (let i = 1; i < snakeBody.length; i++) {
        const prev = snakeBody[i - 1];
        const current = snakeBody[i];
        const dx = prev.x - current.x;
        const dy = prev.y - current.y;
        const distance = Math.hypot(dx, dy);

        if (distance > SEGMENT_DISTANCE) {
          const angle = Math.atan2(dy, dx);
          current.x = prev.x - Math.cos(angle) * SEGMENT_DISTANCE;
          current.y = prev.y - Math.sin(angle) * SEGMENT_DISTANCE;
        }
      }

      // Renderizado
      for (let i = 0; i < snakeElements.length; i++) {
        const el = snakeElements[i];
        const pos = snakeBody[i];
        const offset = i === 0 ? 16 : 13;
        el.style.left = (pos.x - offset) + 'px';
        el.style.top = (pos.y - offset) + 'px';
      }
    }

    function spawnItems() {
      items = [];
      const padding = 60;
      const maxX = window.innerWidth - padding;
      const maxY = window.innerHeight - padding;

      for (let i = 0; i < 5; i++) {
        const randomIcon = worldIcons[Math.floor(Math.random() * worldIcons.length)];
        items.push({
          id: i,
          x: Math.random() * (maxX - padding) + padding,
          y: Math.random() * (maxY - padding * 2) + padding + 40,
          icon: randomIcon
        });
      }
      renderItems();
    }

    function renderItems() {
      itemsContainer.innerHTML = '';
      items.forEach(item => {
        const el = document.createElement('div');
        el.className = 'item';
        el.style.left = (item.x - 18) + 'px';
        el.style.top = (item.y - 18) + 'px';
        el.innerText = item.icon;
        itemsContainer.appendChild(el);
      });
    }

    function checkCollisions() {
      if (!isPlaying || snakeBody.length === 0) return;

      const head = snakeBody[0];

      items = items.filter(item => {
        const dist = Math.hypot(head.x - item.x, head.y - item.y);
        if (dist < 30) {
          collectedItems++;
          collectedDisplay.innerText = collectedItems;
          addSnakeSegment(); // Crece con cada mundo absorbido
          return false;
        }
        return true;
      });

      if (items.length < 5) {
        spawnMoreItems();
      }

      if (collectedItems >= targetItems) {
        completeLevel();
      }
    }

    function spawnMoreItems() {
      const padding = 60;
      const maxX = window.innerWidth - padding;
      const maxY = window.innerHeight - padding;

      while (items.length < 5) {
        const randomIcon = worldIcons[Math.floor(Math.random() * worldIcons.length)];
        items.push({
          id: Math.random(),
          x: Math.random() * (maxX - padding) + padding,
          y: Math.random() * (maxY - padding * 2) + padding + 40,
          icon: randomIcon
        });
      }
      renderItems();
    }

    function completeLevel() {
      isPlaying = false;

      if (currentLevel >= 20) {
        document.getElementById('modal-title').innerText = '🎉 ¡UNIVERSO COMPLETADO!';
        currentLevel = 1;
      } else {
        currentLevel++;
        document.getElementById('modal-title').innerText = `¡Nivel ${currentLevel - 1} Superado!`;
      }
      levelModal.style.display = 'flex';
    }

    function gameLoop() {
      if (isPlaying) {
        updateSnakePositions();
        checkCollisions();
        requestAnimationFrame(gameLoop);
      }
    }

    // Controles
    function setTargetPos(x, y) {
      targetX = Math.max(16, Math.min(window.innerWidth - 16, x));
      targetY = Math.max(16, Math.min(window.innerHeight - 16, y));
    }

    window.addEventListener('touchstart', (e) => {
      if (isPlaying) setTargetPos(e.touches[0].clientX, e.touches[0].clientY);
    });

    window.addEventListener('touchmove', (e) => {
      if (isPlaying) setTargetPos(e.touches[0].clientX, e.touches[0].clientY);
    });

    window.addEventListener('mousemove', (e) => {
      if (isPlaying) setTargetPos(e.clientX, e.clientY);
    });
  </script>
</body>
</html>
