<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Wonderland Adventures</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #FFF9D2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 10px;
    }

    /* Contenedor responsivo */
    #game-container {
      position: relative;
      width: 95vw;
      max-width: 800px;
      height: 65vh;
      max-height: 500px;
      background-color: #FFF3B0;
      border: 6px solid #F6D776;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(212, 175, 55, 0.2);
      overflow: hidden;
    }

    /* HUD */
    .hud {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .badge {
      background: white;
      padding: 6px 12px;
      border-radius: 16px;
      font-weight: bold;
      font-size: 14px;
      color: #6C5CE7;
      border: 2px solid #FFEAA7;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .game-title {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 16px;
      font-weight: 900;
      color: #FF7675;
    }

    /* Elementos del mapa */
    .tree {
      position: absolute;
      width: 8vw;
      height: 8vw;
      max-width: 50px;
      max-height: 50px;
      background: #FAB1A0;
      border-radius: 50%;
      border: 3px solid #FF7675;
    }

    .shop {
      position: absolute;
      top: 10%;
      right: 10%;
      width: 80px;
      height: 70px;
      background: #FFEAA7;
      border: 3px solid #FDCB6E;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 11px;
      color: #D63031;
    }
    
    .shop-roof {
      position: absolute;
      top: -15px;
      width: 90px;
      height: 18px;
      background: #FF7675;
      border-radius: 6px;
    }

    /* Items */
    .item {
      position: absolute;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      animation: float 2s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* Jugador */
    #player {
      position: absolute;
      width: 30px;
      height: 30px;
      background: #74B9FF;
      border: 3px solid #0984E3;
      border-radius: 50%;
      transition: all 0.08s ease-out;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    #player::after { content: '👀'; }

    /* Controles adaptados abajo del marco en celulares */
    .controls {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(2, 45px);
      gap: 6px;
      touch-action: manipulation;
    }

    .btn {
      background: #FFF;
      border: 2px solid #FFEAA7;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      color: #6C5CE7;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 0 #FDCB6E;
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: none;
    }

    .btn-up { grid-column: 2; grid-row: 1; }
    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }

    #message {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: white;
      padding: 6px 12px;
      border-radius: 10px;
      border: 2px solid #74B9FF;
      font-size: 12px;
      font-weight: bold;
      display: none;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud">
      <div class="badge">🪙 <span id="coins">0</span></div>
      <div class="badge">🌸 <span id="flowers">0</span></div>
    </div>
    
    <div class="game-title">WONDERLAND</div>

    <div class="tree" style="top: 20%; left: 15%;"></div>
    <div class="tree" style="top: 60%; left: 20%; background: #81ECEC; border-color: #00CEC9;"></div>
    <div class="tree" style="top: 50%; left: 75%;"></div>

    <div class="shop">
      <div class="shop-roof"></div>
      TIENDA
    </div>

    <div id="player"></div>
    <div id="items-container"></div>
    <div id="message">¡Tienda! 🛒</div>
  </div>

  <div class="controls">
    <button class="btn btn-up" onclick="move(0, -20)">▲</button>
    <button class="btn btn-left" onclick="move(-20, 0)">◄</button>
    <button class="btn btn-down" onclick="move(0, 20)">▼</button>
    <button class="btn btn-right" onclick="move(20, 0)">►</button>
  </div>

  <script>
    const container = document.getElementById('game-container');
    const player = document.getElementById('player');
    const coinsDisplay = document.getElementById('coins');
    const flowersDisplay = document.getElementById('flowers');
    const itemsContainer = document.getElementById('items-container');
    const message = document.getElementById('message');

    const playerState = { x: 100, y: 100, coins: 0, flowers: 0 };

    let items = [
      { id: 1, type: 'coin', x: 80, y: 150, icon: '🪙' },
      { id: 2, type: 'coin', x: 200, y: 80, icon: '🪙' },
      { id: 3, type: 'flower', x: 150, y: 180, icon: '🌸' },
      { id: 4, type: 'flower', x: 220, y: 140, icon: '🌸' }
    ];

    function updatePlayerPosition() {
      player.style.left = playerState.x + 'px';
      player.style.top = playerState.y + 'px';
      checkCollisions();
    }

    function renderItems() {
      itemsContainer.innerHTML = '';
      items.forEach(item => {
        const el = document.createElement('div');
        el.className = `item ${item.type}`;
        el.style.left = item.x + 'px';
        el.style.top = item.y + 'px';
        el.innerText = item.icon;
        itemsContainer.appendChild(el);
      });
    }

    function move(dx, dy) {
      const maxX = container.clientWidth - 35;
      const maxY = container.clientHeight - 35;

      const newX = playerState.x + dx;
      const newY = playerState.y + dy;

      if (newX >= 5 && newX <= maxX) playerState.x = newX;
      if (newY >= 5 && newY <= maxY) playerState.y = newY;

      updatePlayerPosition();
    }

    function checkCollisions() {
      items = items.filter(item => {
        const dist = Math.hypot(playerState.x - item.x, playerState.y - item.y);
        if (dist < 28) {
          if (item.type === 'coin') playerState.coins += 10;
          if (item.type === 'flower') playerState.flowers += 1;
          
          coinsDisplay.innerText = playerState.coins;
          flowersDisplay.innerText = playerState.flowers;
          return false;
        }
        return true;
      });
      renderItems();

      const shopEl = document.querySelector('.shop');
      const shopDist = Math.hypot(playerState.x - shopEl.offsetLeft, playerState.y - shopEl.offsetTop);
      if (shopDist < 50) {
        message.style.display = 'block';
      } else {
        message.style.display = 'none';
      }
    }

    window.addEventListener('keydown', (e) => {
      switch(e.key) {
        case 'ArrowUp': case 'w': move(0, -15); break;
        case 'ArrowDown': case 's': move(0, 15); break;
        case 'ArrowLeft': case 'a': move(-15, 0); break;
        case 'ArrowRight': case 'd': move(15, 0); break;
      }
    });

    updatePlayerPosition();
    renderItems();
  </script>
</body>
</html>
