<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Wonderland Adventures</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #FFF9D2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 10px;
    }

    /* Mapa principal */
    #game-container {
      position: relative;
      width: 95vw;
      max-width: 800px;
      height: 60vh;
      max-height: 500px;
      background-color: #FFF3B0;
      border: 6px solid #F6D776;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(212, 175, 55, 0.2);
      overflow: hidden;
      touch-action: none;
    }

    /* HUD superior */
    .hud {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .badge {
      background: white;
      padding: 6px 12px;
      border-radius: 16px;
      font-weight: bold;
      font-size: 14px;
      color: #6C5CE7;
      border: 2px solid #FFEAA7;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .game-title {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 14px;
      font-weight: 900;
      color: #FF7675;
    }

    /* Decoraciones */
    .tree {
      position: absolute;
      width: 45px;
      height: 45px;
      background: #FAB1A0;
      border-radius: 50%;
      border: 3px solid #FF7675;
      pointer-events: none;
    }

    /* Tienda interactiva */
    .shop {
      position: absolute;
      top: 15%;
      right: 10%;
      width: 85px;
      height: 75px;
      background: #FFEAA7;
      border: 3px solid #FDCB6E;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 11px;
      color: #D63031;
      cursor: pointer;
      box-shadow: 0 4px 0 #FDCB6E;
    }
    
    .shop-roof {
      position: absolute;
      top: -15px;
      width: 95px;
      height: 18px;
      background: #FF7675;
      border-radius: 6px;
    }

    /* Items */
    .item {
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      animation: float 2s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* Personaje */
    #player {
      position: absolute;
      width: 32px;
      height: 32px;
      background: #74B9FF;
      border: 3px solid #0984E3;
      border-radius: 50%;
      transition: all 0.12s ease-out;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      pointer-events: none;
    }

    /* Modal / Tienda flotante */
    #shop-modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 85%;
      max-width: 320px;
      background: white;
      border: 4px solid #FDCB6E;
      border-radius: 16px;
      padding: 15px;
      z-index: 20;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      text-align: center;
    }

    #shop-modal h3 {
      color: #FF7675;
      margin-bottom: 10px;
    }

    .shop-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FFF9D2;
      padding: 8px 12px;
      margin: 8px 0;
      border-radius: 10px;
      font-size: 13px;
      font-weight: bold;
    }

    .buy-btn {
      background: #55E6C1;
      border: none;
      padding: 6px 10px;
      border-radius: 8px;
      color: #2d3436;
      font-weight: bold;
      cursor: pointer;
    }

    .close-btn {
      background: #FF7675;
      border: none;
      color: white;
      padding: 6px 14px;
      border-radius: 8px;
      margin-top: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Controles táctiles abajo */
    .controls {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(3, 55px);
      grid-template-rows: repeat(2, 48px);
      gap: 6px;
      touch-action: manipulation;
    }

    .btn {
      background: #FFF;
      border: 2px solid #FFEAA7;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
      color: #6C5CE7;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 0 #FDCB6E;
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: none;
    }

    .btn-up { grid-column: 2; grid-row: 1; }
    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud">
      <div class="badge">🪙 <span id="coins">0</span></div>
      <div class="badge">🌸 <span id="flowers">0</span></div>
    </div>
    
    <div class="game-title">WONDERLAND</div>

    <div class="tree" style="top: 25%; left: 15%;"></div>
    <div class="tree" style="top: 65%; left: 20%; background: #81ECEC; border-color: #00CEC9;"></div>
    <div class="tree" style="top: 55%; left: 75%;"></div>

    <!-- Tienda interactiva -->
    <div class="shop" onclick="openShop()">
      <div class="shop-roof"></div>
      TIENDA
      <span style="font-size: 9px; color: #666; margin-top:2px;">(Toca aquí)</span>
    </div>

    <div id="player">🤖</div>
    <div id="items-container"></div>

    <!-- Menú Ventana de la Tienda -->
    <div id="shop-modal">
      <h3>🏪 Tienda Pastel</h3>
      <div class="shop-item">
        <span>Velocidad +</span>
        <button class="buy-btn" onclick="buyUpgrade('speed')">15 🪙</button>
      </div>
      <div class="shop-item">
        <span>Nuevo Aspecto (🐱)</span>
        <button class="buy-btn" onclick="buyUpgrade('skin')">2 🌸</button>
      </div>
      <button class="close-btn" onclick="closeShop()">Cerrar</button>
    </div>
  </div>

  <!-- Botones de dirección para celular -->
  <div class="controls">
    <button class="btn btn-up" onclick="move(0, -speed)">▲</button>
    <button class="btn btn-left" onclick="move(-speed, 0)">◄</button>
    <button class="btn btn-down" onclick="move(0, speed)">▼</button>
    <button class="btn btn-right" onclick="move(speed, 0)">►</button>
  </div>

  <script>
    const container = document.getElementById('game-container');
    const player = document.getElementById('player');
    const coinsDisplay = document.getElementById('coins');
    const flowersDisplay = document.getElementById('flowers');
    const itemsContainer = document.getElementById('items-container');
    const shopModal = document.getElementById('shop-modal');

    let speed = 20;
    const playerState = { x: 80, y: 80, coins: 0, flowers: 0 };

    let items = [
      { id: 1, type: 'coin', x: 60, y: 160, icon: '🪙' },
      { id: 2, type: 'coin', x: 180, y: 90, icon: '🪙' },
      { id: 3, type: 'flower', x: 140, y: 200, icon: '🌸' },
      { id: 4, type: 'flower', x: 240, y: 150, icon: '🌸' },
      { id: 5, type: 'coin', x: 200, y: 220, icon: '🪙' }
    ];

    // Mover tocando la pantalla directamente
    container.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#shop-modal') || e.target.closest('.shop')) return;
      const rect = container.getBoundingClientRect();
      const clickX = e.clientX - rect.left - 16;
      const clickY = e.clientY - rect.top - 16;
      
      playerState.x = Math.max(5, Math.min(container.clientWidth - 35, clickX));
      playerState.y = Math.max(5, Math.min(container.clientHeight - 35, clickY));
      updatePlayerPosition();
    });

    function updatePlayerPosition() {
      player.style.left = playerState.x + 'px';
      player.style.top = playerState.y + 'px';
      checkCollisions();
    }

    function renderItems() {
      itemsContainer.innerHTML = '';
      items.forEach(item => {
        const el = document.createElement('div');
        el.className = `item ${item.type}`;
        el.style.left = item.x + 'px';
        el.style.top = item.y + 'px';
        el.innerText = item.icon;
        itemsContainer.appendChild(el);
      });
    }

    function move(dx, dy) {
      const maxX = container.clientWidth - 35;
      const maxY = container.clientHeight - 35;

      const newX = playerState.x + dx;
      const newY = playerState.y + dy;

      if (newX >= 5 && newX <= maxX) playerState.x = newX;
      if (newY >= 5 && newY <= maxY) playerState.y = newY;

      updatePlayerPosition();
    }

    function checkCollisions() {
      items = items.filter(item => {
        const dist = Math.hypot(playerState.x - item.x, playerState.y - item.y);
        if (dist < 30) {
          if (item.type === 'coin') playerState.coins += 10;
          if (item.type === 'flower') playerState.flowers += 1;
          
          coinsDisplay.innerText = playerState.coins;
          flowersDisplay.innerText = playerState.flowers;
          return false;
        }
        return true;
      });
      renderItems();
    }

    // Funciones de la Tienda
    function openShop() {
      shopModal.style.display = 'block';
    }

    function closeShop() {
      shopModal.style.display = 'none';
    }

    function buyUpgrade(type) {
      if (type === 'speed' && playerState.coins >= 15) {
        playerState.coins -= 15;
        speed += 10;
        alert('¡Velocidad aumentada!');
      } else if (type === 'skin' && playerState.flowers >= 2) {
        playerState.flowers -= 2;
        player.innerText = '🐱';
        alert('¡Nuevo aspecto desbloqueado!');
      } else {
        alert('¡No tienes suficientes recursos!');
      }
      coinsDisplay.innerText = playerState.coins;
      flowersDisplay.innerText = playerState.flowers;
    }

    // Teclado opcional
    window.addEventListener('keydown', (e) => {
      switch(e.key) {
        case 'ArrowUp': case 'w': move(0, -speed); break;
        case 'ArrowDown': case 's': move(0, speed); break;
        case 'ArrowLeft': case 'a': move(-speed, 0); break;
        case 'ArrowRight': case 'd': move(speed, 0); break;
      }
    });

    updatePlayerPosition();
    renderItems();
  </script>
</body>
</html>
