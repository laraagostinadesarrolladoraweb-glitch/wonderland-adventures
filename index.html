<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Snake Wonderland</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a2e;
      touch-action: none;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #16213e 0%, #0f3460 100%);
    }

    /* Grid de fondo decorativo */
    .bg-grid {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    /* HUD Superior */
    .hud {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .badge {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 15px;
      color: #e94560;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      letter-spacing: 0.5px;
    }

    .badge-target {
      color: #00fff5;
    }

    /* Componentes de la Viborita */
    .snake-node {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      transition: background 0.3s ease;
    }

    .snake-head {
      width: 32px;
      height: 32px;
      background: #00fff5;
      box-shadow: 0 0 15px #00fff5;
      z-index: 6;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 4px;
    }

    /* Ojitos de la víbora */
    .snake-head::before, .snake-head::after {
      content: '';
      width: 6px;
      height: 6px;
      background-color: #0f3460;
      border-radius: 50%;
    }

    .snake-body {
      width: 26px;
      height: 26px;
      background: #00adb5;
      box-shadow: 0 0 8px rgba(0, 173, 181, 0.5);
      z-index: 5;
    }

    /* Coleccionables */
    .item {
      position: absolute;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      animation: float 2s infinite ease-in-out;
      filter: drop-shadow(0 0 8px rgba(255, 105, 180, 0.6));
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-7px) scale(1.08); }
    }

    /* Overlay / Menú */
    .overlay {
      display: flex;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(15, 52, 96, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 20;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }

    .overlay-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 35px 25px;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .overlay h2 { 
      color: #00fff5; 
      margin-bottom: 20px; 
      font-size: 26px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-action {
      background: linear-gradient(45deg, #e94560, #ff6b6b);
      border: none;
      padding: 14px 32px;
      border-radius: 50px;
      color: #ffffff;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
      transition: all 0.2s ease;
    }

    .btn-action:active { 
      transform: scale(0.96);
      box-shadow: 0 2px 8px rgba(233, 69, 96, 0.4);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="bg-grid"></div>
    
    <div class="hud">
      <div class="badge">Nivel <span id="level-num">1</span>/20</div>
      <div class="badge badge-target">Flores: <span id="collected">0</span>/<span id="target">5</span> 🌸</div>
    </div>

    <!-- Contenedor para el cuerpo de la serpiente -->
    <div id="snake-container"></div>

    <!-- Items -->
    <div id="items-container"></div>

    <!-- Cartel inicial / nivel -->
    <div id="level-modal" class="overlay">
      <div class="overlay-card">
        <h2 id="modal-title">¡Viborita!</h2>
        <button class="btn-action" onclick="startLevel()">¡Empezar!</button>
      </div>
    </div>
  </div>

  <script>
    const container = document.getElementById('game-container');
    const snakeContainer = document.getElementById('snake-container');
    const itemsContainer = document.getElementById('items-container');
    const levelDisplay = document.getElementById('level-num');
    const collectedDisplay = document.getElementById('collected');
    const targetDisplay = document.getElementById('target');
    const levelModal = document.getElementById('level-modal');

    let currentLevel = 1;
    let targetItems = 5;
    let collectedItems = 0;
    let isPlaying = false;

    // Configuración de la serpiente
    const SEGMENT_DISTANCE = 14;
    let snakeBody = []; // Guardará las posiciones {x, y} de cada nodo
    let snakeElements = []; // Nodos DOM
    let targetX = window.innerWidth / 2;
    let targetY = window.innerHeight / 2;
    let items = [];

    function startLevel() {
      levelModal.style.display = 'none';
      targetItems = 3 + (currentLevel * 2);
      collectedItems = 0;
      
      levelDisplay.innerText = currentLevel;
      targetDisplay.innerText = targetItems;
      collectedDisplay.innerText = collectedItems;

      targetX = window.innerWidth / 2;
      targetY = window.innerHeight / 2;

      initSnake();
      spawnItems();
      isPlaying = true;
      requestAnimationFrame(gameLoop);
    }

    function initSnake() {
      snakeContainer.innerHTML = '';
      snakeBody = [];
      snakeElements = [];

      // Tamaño inicial: cabeza + 3 segmentos
      const initialLength = 4;
      for (let i = 0; i < initialLength; i++) {
        snakeBody.push({ x: targetX, y: targetY + (i * SEGMENT_DISTANCE) });
        
        const el = document.createElement('div');
        el.className = 'snake-node ' + (i === 0 ? 'snake-head' : 'snake-body');
        snakeContainer.appendChild(el);
        snakeElements.push(el);
      }
    }

    function addSnakeSegment() {
      const lastSegment = snakeBody[snakeBody.length - 1];
      snakeBody.push({ x: lastSegment.x, y: lastSegment.y });

      const el = document.createElement('div');
      el.className = 'snake-node snake-body';
      snakeContainer.appendChild(el);
      snakeElements.push(el);
    }

    function updateSnakePositions() {
      if (snakeBody.length === 0) return;

      // Movimiento suave de la cabeza hacia el objetivo (interpolación)
      snakeBody[0].x += (targetX - snakeBody[0].x) * 0.2;
      snakeBody[0].y += (targetY - snakeBody[0].y) * 0.2;

      // El cuerpo sigue a la cabeza manteniendo la distancia
      for (let i = 1; i < snakeBody.length; i++) {
        const prev = snakeBody[i - 1];
        const current = snakeBody[i];
        const dx = prev.x - current.x;
        const dy = prev.y - current.y;
        const distance = Math.hypot(dx, dy);

        if (distance > SEGMENT_DISTANCE) {
          const angle = Math.atan2(dy, dx);
          current.x = prev.x - Math.cos(angle) * SEGMENT_DISTANCE;
          current.y = prev.y - Math.sin(angle) * SEGMENT_DISTANCE;
        }
      }

      // Renderizar en pantalla
      for (let i = 0; i < snakeElements.length; i++) {
        const el = snakeElements[i];
        const pos = snakeBody[i];
        const offset = i === 0 ? 16 : 13; // Ajuste según diámetro del nodo
        el.style.left = (pos.x - offset) + 'px';
        el.style.top = (pos.y - offset) + 'px';
      }
    }

    function spawnItems() {
      items = [];
      const padding = 60;
      const maxX = window.innerWidth - padding;
      const maxY = window.innerHeight - padding;

      for (let i = 0; i < 5; i++) {
        items.push({
          id: i,
          x: Math.random() * (maxX - padding) + padding,
          y: Math.random() * (maxY - padding * 2) + padding + 40,
          icon: '🌸'
        });
      }
      renderItems();
    }

    function renderItems() {
      itemsContainer.innerHTML = '';
      items.forEach(item => {
        const el = document.createElement('div');
        el.className = 'item';
        el.style.left = (item.x - 17) + 'px';
        el.style.top = (item.y - 17) + 'px';
        el.innerText = item.icon;
        itemsContainer.appendChild(el);
      });
    }

    function checkCollisions() {
      if (!isPlaying || snakeBody.length === 0) return;

      const head = snakeBody[0];

      items = items.filter(item => {
        const dist = Math.hypot(head.x - item.x, head.y - item.y);
        if (dist < 28) {
          collectedItems++;
          collectedDisplay.innerText = collectedItems;
          addSnakeSegment(); // Crece la viborita al comer
          return false;
        }
        return true;
      });

      if (items.length < 5) {
        spawnMoreItems();
      }

      if (collectedItems >= targetItems) {
        completeLevel();
      }
    }

    function spawnMoreItems() {
      const padding = 60;
      const maxX = window.innerWidth - padding;
      const maxY = window.innerHeight - padding;

      while (items.length < 5) {
        items.push({
          id: Math.random(),
          x: Math.random() * (maxX - padding) + padding,
          y: Math.random() * (maxY - padding * 2) + padding + 40,
          icon: '🌸'
        });
      }
      renderItems();
    }

    function completeLevel() {
      isPlaying = false;

      if (currentLevel >= 20) {
        document.getElementById('modal-title').innerText = '🎉 ¡JUEGO COMPLETADO!';
        currentLevel = 1;
      } else {
        currentLevel++;
        document.getElementById('modal-title').innerText = `¡Nivel ${currentLevel - 1} Superado!`;
      }
      levelModal.style.display = 'flex';
    }

    function gameLoop() {
      if (isPlaying) {
        updateSnakePositions();
        checkCollisions();
        requestAnimationFrame(gameLoop);
      }
    }

    // Controles Táctiles y Ratón
    function setTargetPos(x, y) {
      targetX = Math.max(16, Math.min(window.innerWidth - 16, x));
      targetY = Math.max(16, Math.min(window.innerHeight - 16, y));
    }

    window.addEventListener('touchstart', (e) => {
      if (isPlaying) setTargetPos(e.touches[0].clientX, e.touches[0].clientY);
    });

    window.addEventListener('touchmove', (e) => {
      if (isPlaying) setTargetPos(e.touches[0].clientX, e.touches[0].clientY);
    });

    window.addEventListener('mousemove', (e) => {
      if (isPlaying) setTargetPos(e.clientX, e.clientY);
    });
  </script>
</body>
</html>
