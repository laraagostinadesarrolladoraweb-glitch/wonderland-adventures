<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wonderland</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #FFF9D2;
      touch-action: none;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-color: #FFF3B0;
    }

    /* HUD Superior */
    .hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .hud-group {
      display: flex;
      gap: 10px;
    }

    .badge {
      background: rgba(255, 255, 255, 0.9);
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
      color: #6C5CE7;
      border: 2px solid #FFEAA7;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    /* Personaje principal: Único círculo pastel */
    #player-circle {
      position: absolute;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #74B9FF;
      border: 3px solid #0984E3;
      box-shadow: 0 4px 8px rgba(116, 185, 255, 0.4);
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    /* Coleccionables */
    .item {
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      animation: float 1.5s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    /* Modal / Pantalla inicial */
    .overlay {
      display: flex;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255, 249, 210, 0.92);
      z-index: 20;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }

    .overlay-card {
      background: white;
      border: 4px solid #FDCB6E;
      border-radius: 20px;
      padding: 25px 20px;
      width: 90%;
      max-width: 340px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .overlay h2 { 
      color: #FF7675; 
      margin-bottom: 15px; 
      font-size: 24px;
    }

    .btn-action {
      background: #55E6C1;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      color: #2D3436;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 0 #00B894;
    }

    .btn-action:active { 
      transform: translateY(2px); 
      box-shadow: none; 
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud">
      <div class="hud-group">
        <div class="badge">Nivel <span id="level-num">1</span>/20</div>
        <div class="badge">🪙 <span id="coins">0</span></div>
      </div>
      <div class="badge">Meta: <span id="collected">0</span>/<span id="target">5</span> 🌸</div>
    </div>

    <!-- Personaje -->
    <div id="player-circle">✨</div>

    <!-- Items -->
    <div id="items-container"></div>

    <!-- Cartel inicial -->
    <div id="level-modal" class="overlay">
      <div class="overlay-card">
        <h2 id="modal-title">¡Bienvenida/o!</h2>
        <button class="btn-action" onclick="startLevel()">¡Empezar!</button>
      </div>
    </div>
  </div>

  <script>
    const container = document.getElementById('game-container');
    const player = document.getElementById('player-circle');
    const itemsContainer = document.getElementById('items-container');
    const levelDisplay = document.getElementById('level-num');
    const coinsDisplay = document.getElementById('coins');
    const collectedDisplay = document.getElementById('collected');
    const targetDisplay = document.getElementById('target');
    const levelModal = document.getElementById('level-modal');

    let currentLevel = 1;
    let coins = 0;
    let targetItems = 5;
    let collectedItems = 0;
    let isPlaying = false;

    // Posición del círculo
    let posX = window.innerWidth / 2 - 18;
    let posY = window.innerHeight / 2 - 18;
    let items = [];

    // Arrastrar el círculo con el dedo
    let isDragging = false;

    function startLevel() {
      levelModal.style.display = 'none';
      targetItems = 3 + (currentLevel * 2);
      collectedItems = 0;
      
      levelDisplay.innerText = currentLevel;
      targetDisplay.innerText = targetItems;
      collectedDisplay.innerText = collectedItems;

      // Posición inicial centrada
      posX = window.innerWidth / 2 - 18;
      posY = window.innerHeight / 2 - 18;
      updatePlayerPosition();

      spawnItems();
      isPlaying = true;
    }

    function updatePlayerPosition() {
      player.style.left = posX + 'px';
      player.style.top = posY + 'px';
      checkCollisions();
    }

    function spawnItems() {
      items = [];
      const padding = 50;
      const maxX = window.innerWidth - padding;
      const maxY = window.innerHeight - padding;

      for (let i = 0; i < 5; i++) {
        items.push({
          id: i,
          x: Math.random() * (maxX - padding) + padding,
          y: Math.random() * (maxY - padding * 2) + padding + 40,
          type: Math.random() > 0.3 ? 'flower' : 'coin',
          icon: Math.random() > 0.3 ? '🌸' : '🪙'
        });
      }
      renderItems();
    }

    function renderItems() {
      itemsContainer.innerHTML = '';
      items.forEach(item => {
        const el = document.createElement('div');
        el.className = 'item';
        el.style.left = item.x + 'px';
        el.style.top = item.y + 'px';
        el.innerText = item.icon;
        itemsContainer.appendChild(el);
      });
    }

    function checkCollisions() {
      if (!isPlaying) return;

      items = items.filter(item => {
        const dist = Math.hypot(posX - item.x, posY - item.y);
        if (dist < 32) { // Rango de recolección
          if (item.type === 'flower') {
            collectedItems++;
            collectedDisplay.innerText = collectedItems;
          } else {
            coins += 10;
            coinsDisplay.innerText = coins;
          }
          return false;
        }
        return true;
      });

      renderItems();

      if (items.length < 3) {
        spawnMoreItems();
      }

      if (collectedItems >= targetItems) {
        completeLevel();
      }
    }

    function spawnMoreItems() {
      const padding = 50;
      const maxX = window.innerWidth - padding;
      const maxY = window.innerHeight - padding;

      while (items.length < 5) {
        items.push({
          id: Math.random(),
          x: Math.random() * (maxX - padding) + padding,
          y: Math.random() * (maxY - padding * 2) + padding + 40,
          type: Math.random() > 0.3 ? 'flower' : 'coin',
          icon: Math.random() > 0.3 ? '🌸' : '🪙'
        });
      }
      renderItems();
    }

    function completeLevel() {
      isPlaying = false;

      if (currentLevel >= 20) {
        document.getElementById('modal-title').innerText = '🎉 ¡FELICIDADES!';
        currentLevel = 1;
      } else {
        currentLevel++;
        document.getElementById('modal-title').innerText = `¡Nivel ${currentLevel - 1} Superado!`;
      }
      levelModal.style.display = 'flex';
    }

    // Controles táctiles continuos deslizando el dedo
    window.addEventListener('touchstart', (e) => {
      if (!isPlaying) return;
      isDragging = true;
      moveCircle(e.touches[0]);
    });

    window.addEventListener('touchmove', (e) => {
      if (!isPlaying || !isDragging) return;
      moveCircle(e.touches[0]);
    });

    window.addEventListener('touchend', () => {
      isDragging = false;
    });

    function moveCircle(touch) {
      const radius = 18;
      posX = Math.max(0, Math.min(window.innerWidth - radius * 2, touch.clientX - radius));
      posY = Math.max(0, Math.min(window.innerHeight - radius * 2, touch.clientY - radius));
      updatePlayerPosition();
    }

    // Soporte para mouse en PC
    window.addEventListener('mousedown', (e) => {
      if (!isPlaying) return;
      isDragging = true;
      moveCircleMouse(e);
    });

    window.addEventListener('mousemove', (e) => {
      if (!isPlaying || !isDragging) return;
      moveCircleMouse(e);
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    function moveCircleMouse(e) {
      const radius = 18;
      posX = Math.max(0, Math.min(window.innerWidth - radius * 2, e.clientX - radius));
      posY = Math.max(0, Math.min(window.innerHeight - radius * 2, e.clientY - radius));
      updatePlayerPosition();
    }
  </script>
</body>
</html>
